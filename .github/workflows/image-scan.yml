name: Image scan

# Builds the standalone template's runtime image of each target, runs the
# image checks on it, and scans it with Trivy. The targets are `develop`, what
# the next release will ship; `latest`, the latest release; and each older
# minor still supported, as `X.Y`, which builds that minor's newest release
# tag. A minor leaves the list when its support ends.
#
# A rebuild of an unchanged tag takes the Node minor's newest patch and
# Alpine's current packages, but not a fix that ships only in a newer Node
# minor or in an npm package the image carries; this run finds those. Trivy
# reports only vulnerabilities that have a fix (`--ignore-unfixed`): one with
# no fix yet gives nothing to rebuild with, and would keep the run red until a
# fix ships. A `schedule` event runs the copy of this file on the default
# branch, develop.
#
# No input selects a ref, so no code but develop's and release tags' runs
# here. It restores and saves no cache.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `latest` is GitHub's latest release, never a prerelease or a draft. A minor
  # `X.Y` is its highest release tag vX.Y.Z. A tag is `v` + the version it
  # published, which the scaffold names; develop's scaffold names the newest
  # published version, as CI's does.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # develop, latest, and each older minor still supported as X.Y.
      TARGETS: develop latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Resolve the targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rows=()
          for target in $TARGETS; do
            case "$target" in
              develop)
                rows+=("$(jq -cn --arg t develop '{target: $t, ref: "develop", version: ""}')")
                continue
                ;;
              latest)
                tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
                ;;
              *)
                if [[ ! "$target" =~ ^[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::a target is develop, latest or a minor X.Y: '$target'"
                  exit 1
                fi
                tag="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$target." --jq '.[].ref | ltrimstr("refs/tags/")' \
                  | { grep -E "^v${target//./\\.}\.[0-9]+$" || true; } | sort -V | tail -n 1)"
                ;;
            esac
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$target has no release tag vX.Y.Z: '$tag'"
              exit 1
            fi
            rows+=("$(jq -cn --arg t "$target" --arg r "$tag" '{target: $t, ref: $r, version: ($r | ltrimstr("v"))}')")
          done
          echo "targets=$(printf '%s\n' "${rows[@]}" | jq -cs .)" >> "$GITHUB_OUTPUT"

  image-scan:
    name: image-scan (${{ matrix.target }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.targets) }}
    uses: ./.github/workflows/template-image.yml
    with:
      ref: ${{ matrix.ref }}
      version: ${{ matrix.version }}
      scan: true
      cache: false
      timeout-minutes: 20
