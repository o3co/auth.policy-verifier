name: Image scan

# Builds the standalone template's runtime image from the latest release, runs
# the image checks on it, and scans it with Trivy. A rebuild of an unchanged
# tag takes the Node minor's newest patch and Alpine's current packages, but
# not a fix that ships only in a newer Node minor, in an npm package the image
# carries, or in an Alpine package Alpine has not fixed yet; this run finds
# those. A `schedule` event runs the copy of this file on the default branch,
# develop.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to build and scan (empty for the latest release)
        required: false
        type: string

permissions:
  contents: read

jobs:
  # GitHub's latest release is never a prerelease or a draft. A release tag
  # is `v` + the version it published; any other ref scaffolds against the
  # newest published version.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      - name: Resolve the ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "$REF" ]; then
            REF="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          version=""
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            version="${REF#v}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image-scan:
    needs: resolve
    uses: ./.github/workflows/template-image.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      version: ${{ needs.resolve.outputs.version }}
      scan: true
      timeout-minutes: 20
