services:
  app:
    build:
      context: .
      target: develop
    ports:
      - "3000:3000"
    volumes:
      - ./src:/home/node/src
      - ./config:/home/node/config
    environment:
      # application.conf binds loopback by default, which inside a container
      # means "reachable from nothing" — the published port would never connect.
      # Binding all interfaces is therefore an explicit opt-in per deployment,
      # and it is why HTTP_CALLER_AUTH_TOKEN is worth setting in .env: past the
      # container boundary, anyone who can reach the port can ask for decisions.
      - HTTP_HOSTNAME=0.0.0.0
      # Where the Cedar http engine finds the `cedar-engine` profile below — read
      # only when the app composes cedarPolicyModule without the wasm package.
      # The engine has no default address (a missing one refuses to start,
      # naming this variable and the wasm package), so it is stated here, as an
      # interpolation default: an `environment` entry outranks `env_file`, so a
      # literal value would ignore a CEDAR_ENDPOINT set in .env for another agent.
      - CEDAR_ENDPOINT=${CEDAR_ENDPOINT:-http://127.0.0.1:8180}
    env_file:
      - path: .env
        required: false

  # Out-of-process Cedar engine, for deployments that evaluate Cedar policies
  # through @o3co/auth.policy-verifier.cedar without the in-process wasm
  # package (its README, "Running out of process"). Opt in per run:
  #
  #   docker compose --profile cedar up --build
  #
  # It shares the app container's network namespace, so the verifier reaches
  # it on loopback at CEDAR_ENDPOINT (http://127.0.0.1:8180, set on the app
  # above), and nothing outside the pair can reach it at all —
  # the same trust boundary the verifier's own bind address draws. The
  # verifier pushes its config/policies into the agent at boot; nothing is
  # mounted here. Pinned by digest for the reason the base image is.
  cedar-engine:
    image: permitio/cedar-agent:0.2.2@sha256:2a7713bce95220eb2ad870ba311f1ae8a4d6e607d13720747d75b96cb0c551ca
    profiles: ["cedar"]
    network_mode: "service:app"
    environment:
      - CEDAR_AGENT_ADDR=127.0.0.1
      - CEDAR_AGENT_PORT=8180
      # To require a token on every call, set it on both sides:
      #   CEDAR_AGENT_AUTHENTICATION here, CEDAR_AUTHENTICATION on the app.
